version: 1.0.3
description: UPF2 configuration (S-NSSAI 2 — SD 112233)

pfcp:
  addr: upf2.free5gc.org
  nodeID: upf2.free5gc.org
  retransTimeout: 1s
  maxRetrans: 3

gtpu:
  forwarder: gtp5g
  ifList:
    - addr: upf2.free5gc.org
      type: N3

dnnList:
  - dnn: internet
    cidr: 10.61.0.0/16

logger:
  enable: true
  level: info
  reportCaller: false
