info:
  version: 1.0.7
  description: SMF config for Compromised SMF Attack PoC (2 UPFs)

configuration:
  smfName: SMF
  sbi:
    scheme: http
    registerIPv4: smf.free5gc.org
    bindingIPv4: smf.free5gc.org
    port: 8000
    tls:
      key: cert/smf.key
      pem: cert/smf.pem
  serviceNameList:
    - nsmf-pdusession
    - nsmf-event-exposure
    - nsmf-oam
  snssaiInfos:
    # S-NSSAI 1 → routed to UPF1
    - sNssai:
        sst: 1
        sd: 010203
      dnnInfos:
        - dnn: internet
          dns:
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
    # S-NSSAI 2 → routed to UPF2
    - sNssai:
        sst: 1
        sd: 112233
      dnnInfos:
        - dnn: internet
          dns:
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
  plmnList:
    - mcc: 208
      mnc: 93
  locality: area1
  pfcp:
    nodeID: smf.free5gc.org
    listenAddr: smf.free5gc.org
    externalAddr: smf.free5gc.org
  userplaneInformation:
    upNodes:
      gNB1:
        type: AN
      UPF1:
        type: UPF
        nodeID: upf1.free5gc.org
        addr: upf1.free5gc.org
        sNssaiUpfInfos:
          - sNssai:
              sst: 1
              sd: 010203
            dnnUpfInfoList:
              - dnn: internet
                pools:
                  - cidr: 10.60.0.0/16
                staticPools:
                  - cidr: 10.60.100.0/24
        interfaces:
          - interfaceType: N3
            endpoints:
              - upf1.free5gc.org
            networkInstances:
              - internet
      UPF2:
        type: UPF
        nodeID: upf2.free5gc.org
        addr: upf2.free5gc.org
        sNssaiUpfInfos:
          - sNssai:
              sst: 1
              sd: 112233
            dnnUpfInfoList:
              - dnn: internet
                pools:
                  - cidr: 10.61.0.0/16
                staticPools:
                  - cidr: 10.61.100.0/24
        interfaces:
          - interfaceType: N3
            endpoints:
              - upf2.free5gc.org
            networkInstances:
              - internet
    links:
      - A: gNB1
        B: UPF1
      - A: gNB1
        B: UPF2
  t3591:
    enable: true
    expireTime: 16s
    maxRetryTimes: 3
  t3592:
    enable: true
    expireTime: 16s
    maxRetryTimes: 3
  nrfUri: http://nrf.free5gc.org:8000
  nrfCertPem: cert/nrf.pem
  urrPeriod: 10
  urrThreshold: 1000
  requestedUnit: 1000

logger:
  enable: true
  level: debug
  reportCaller: false
